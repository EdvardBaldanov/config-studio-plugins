name: Auto-Sync Registry with Plugin Releases

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:      # Manual trigger
  repository_dispatch:    # Webhook trigger from plugin repositories

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest releases and plugin manifests
        run: node scripts/sync-registry.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --staged --quiet; then
            echo "No registry changes detected."
          else
            git commit -m "chore(registry): auto-sync latest official plugin releases [skip ci]"
            git push origin main
          fi
